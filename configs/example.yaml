# GeoCrop Engine — annotated example configuration.
# Every key is optional; omitted keys take the defaults shown by `geocrop config-check --config <file>`.
project: my-crop-map
seed: 42

grid:
  crs: EPSG:32634            # one projected CRS for the whole AOI
  resolution_m: 10
  reference: data/reference/grid.tif   # created with: geocrop grid --aoi aoi.gpkg --crs EPSG:32634 --out ...

# Phenological windows. Fix the dates only after `geocrop inventory` shows real scene availability.
windows:
  P1: {start: "2023-04-01", end: "2023-05-31"}
  P2: {start: "2023-06-01", end: "2023-07-15"}
  P3: {start: "2023-07-16", end: "2023-08-31"}
  P4: {start: "2023-09-01", end: "2023-10-15"}

paths:
  s2_scenes: data/interim/s2          # folders from `geocrop s2-import`
  s1_scenes: data/interim/s1          # folders from `geocrop s1-import`
  composites: data/processed/composites
  features: data/features/stack.tif
  training: data/reference/training.gpkg      # polygon_id, class_name
  parcels: data/reference/parcels.gpkg        # parcel_id, declared_crop
  observations: data/reference/observations.gpkg  # class_name, observed_at (points)
  output: outputs/run

compositing:
  statistic: median          # median | mean | p25 | p75 ...
  scl_invalid: [0, 1, 3, 8, 9, 10, 11]
  cloud_probability_max: null   # e.g. 40 to also use MSK_CLDPRB
  mask_dilation_px: 2        # grow cloud/shadow masks to suppress halos
  min_valid_observations: 1

  temporal_screening: true  # drop residual clouds/shadows that are outliers in time

# Optional: features from the full time series of individual scenes (merged into the feature stack)
timeseries:
  enabled: false
  start: "2023-03-15"
  end: "2023-10-31"
  s2_indices: [NDVI, NDRE, NDMI]
  s1_indices: [VHVV_dB]
  step_days: 5
  output_step_days: 15
  lambda: 50
  min_observed_fraction: 0  # optional occupied-bin fraction required before using reconstructed features
  max_gap_days: null        # optional longest consecutive empty-bin duration, including season edges
  envelope_iterations: 2

# Optional: Checks-by-Monitoring markers and traffic light
cbm:
  enabled: false
  index: NDVI
  calendar: configs/crop_calendar.example.yaml
  # event_markers: false     # geocrop run: also S1 signatures + harvest/tillage/mowing/homogeneity markers
  # events: {abrupt_drop: 0.2, s1_group_by: orbit_direction}   # docs/markers.md
  # temporal_support: {enabled: true, min_clear_observations: 6}   # route weak support to review
  # rules:                   # traffic-light marker rules with reason codes (implies event_markers)
  #   enabled: true
  #   harvest_expected_classes: [maize, soybean, sunflower]
  #   tillage_forbidden_classes: [grassland]

s1:
  separate_orbits: true      # keep ASC and DESC apart until their comparability is assessed
  statistic: mean            # computed in linear power, converted to dB at feature time

features:
  s2_bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  s2_indices: [NDVI, EVI, MSAVI2, NDRE, RECI, GCVI, NDMI, BSI]
  s1: [VV_dB, VH_dB, VHVV_dB]
  deltas: [NDVI, NDRE, NDMI, VH_dB]
  seasonal: [NDVI]
  # embeddings:              # optional `emb` group; geocrop run then has an embeddings stage (docs/embeddings.md)
  #   source: alphaearth     # alphaearth | tessera | presto (geocrop run); galileo | anysat | a list: geocrop embeddings
  #   year: 2023

classes:
  label_field: class_name
  id_field: polygon_id
  targets: [soybean, sunflower]

model:
  algorithm: rf              # rf | extra_trees | hist_gb | lightgbm | catboost | tempcnn | ltae | <plugin>
  calibrate: true            # temperature scaling of probabilities
  calibration_mode: oof      # oof diagnostics | holdout: keep calibration spatial groups out of fitting
  calibration_fraction: 0.2  # fraction of groups reserved only in holdout mode
  n_estimators: 500
  max_features: sqrt
  min_samples_leaf: 1
  class_weight: balanced_subsample
  max_samples_per_polygon: 250
  cv_folds: 5
  spatial_block_m: 5000
  spatial_buffer_m: 0        # optional: purge whole training polygons within this distance of test samples
  tune_grid: null            # e.g. {max_features: [sqrt, 0.2, 0.4], min_samples_leaf: [1, 3]}
  # params: {min_samples_split: 4}   # estimator-specific settings (e.g. of a plugin), checked against the estimator

# Optional transfer validation (docs/validation-protocols.md); default spatial_blocks
# cv:
#   strategy: region         # spatial_blocks | region | year | region_year
#   region_field: region     # training-polygon attribute copied into the samples

# Optional edge-aware probability smoothing before argmax and parcel aggregation
# predict:
#   smoothing: {enabled: true, window: 7, smoothness: 10}

# Optional parcel-level classifier on the cbm signatures (needs cbm.enabled; docs/parcel-classification.md)
# parcel_classify:
#   enabled: true
#   label_field: verified_crop   # independently verified classes, never the declarations
#   decision: additional         # additional | replace (parcels/ then holds its decisions)
#   params: {algorithm: rf, n_estimators: 300}

experiments:
  E0_S2_bands: {groups: [s2_band]}
  E1_S2_indices_temporal: {groups: [s2_band, s2_index, delta, seasonal]}
  E2_S1_only: {groups: [s1]}
  E3_fusion: {groups: [s2_band, s2_index, s1, delta, seasonal]}
  E4_early_season: {groups: [s2_band, s2_index, s1, delta], periods: [P1, P2]}

parcels:
  id_field: parcel_id
  declared_field: declared_crop
  crop_mapping: null         # CSV source_code,class_name
  strategy: combined         # majority | mean_probability | combined
  interior_buffer_px: 1
  min_valid_pixels: 4
  min_confidence: null       # choose on separate development data; freeze before independent validation
  min_majority_share: null
  min_margin: null
  conformal_alpha: 0.1       # nominal prediction-set level; verify coverage independently
  min_aoa_fraction: 0.5      # parcels mostly outside the Area of Applicability go to review

validation:
  label_field: class_name
  date_field: observed_at
  year: 2023
  training_exclusion_m: 50
  window_px: 1
  bootstrap: 1000

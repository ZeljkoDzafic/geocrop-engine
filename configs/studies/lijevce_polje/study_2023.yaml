# Case study: summer-crop classification and declaration verification, 2023 season,
# Lijevče polje (lower Vrbas plain; municipalities Gradiška, Laktaši and Srbac), Republic of Srpska, BiH.
# AOI: configs/studies/lijevce_polje/aoi.geojson, generated by tools/make_study_aoi.py (docs/studies/lijevce-polje.md).
# The AOI (16.99-17.80 E) lies entirely in UTM zone 33 (12-18 E), so a single CRS EPSG:32633 is used.
# Windows are taken from configs/rs_north_2023.yaml; the 2023 scene inventory over the AOI (docs/studies/
# lijevce-polje.md) shows P1 is the cloudiest window - keep the dates PROVISIONAL until imports are inspected.
project: lijevce-polje-2023
seed: 42

grid:
  crs: EPSG:32633
  resolution_m: 10
  # geocrop grid --aoi configs/studies/lijevce_polje/aoi.geojson --crs EPSG:32633 --out data/lijevce_polje/reference/grid_10m.tif
  reference: data/lijevce_polje/reference/grid_10m.tif

windows:
  P1: {start: "2023-04-01", end: "2023-05-31"}   # early season, bare/partly covered soil
  P2: {start: "2023-06-01", end: "2023-07-15"}   # intensive vegetative growth
  P3: {start: "2023-07-16", end: "2023-08-31"}   # closed canopy, high biomass
  P4: {start: "2023-09-01", end: "2023-10-15"}   # senescence, approach to harvest

paths:
  s2_scenes: data/lijevce_polje/interim/s2       # geocrop stac-import --reference <grid> ...
  s1_scenes: data/lijevce_polje/interim/s1
  composites: data/lijevce_polje/processed/composites_2023
  features: data/lijevce_polje/features/stack_2023.tif
  # TODO: training polygons for Lijevče polje are not available yet (subset of the RS 2023 reference set
  #       inside the AOI must be selected and recounted; polygon_id, class_name).
  training: data/lijevce_polje/reference/training_2023.gpkg
  # TODO: LPIS / declared parcels 2023 for Gradiška, Laktaši, Srbac are not available in this repository
  #       (restricted administrative data; parcel_id, declared_crop).
  parcels: data/lijevce_polje/reference/lpis_2023.gpkg
  # TODO: independent field observations 2023 inside the AOI (class_name, observed_at).
  observations: data/lijevce_polje/reference/field_observations_2023.gpkg
  output: outputs/lijevce_polje_2023

compositing:
  statistic: median
  mask_dilation_px: 2
  min_valid_observations: 1
  temporal_screening: true

timeseries:
  enabled: true
  start: "2023-03-15"
  end: "2023-10-31"
  s2_indices: [NDVI, NDRE, NDMI]
  s1_indices: [VHVV_dB]
  envelope_iterations: 2

cbm:
  enabled: true
  calendar: configs/crop_calendar.example.yaml

s1:
  separate_orbits: true

features:
  deltas: [NDVI, NDRE, NDMI, VH_dB, VHVV_dB]
  seasonal: [NDVI, NDRE]

classes:
  targets: [soybean, sunflower, maize]
  # TODO: class counts for Lijevče polje (the 366 polygons of rs_north_2023 cover 25 units; recount inside the AOI)

model:
  n_estimators: 500
  cv_folds: 5
  spatial_block_m: 5000
  tune_grid: {max_features: [sqrt, 0.2, 0.35], min_samples_leaf: [1, 3]}

# Transfer check inside the AOI: leave-one-municipality-out needs a `municipality` attribute on the training
# polygons (only 3 groups: Gradiška, Laktaši, Srbac). TODO: enable once the training set is available, e.g.
# cv: {strategy: region, region_field: municipality}

experiments:
  E0_S2_bands: {groups: [s2_band]}
  E1_S2_bands_indices: {groups: [s2_band, s2_index]}
  E2_S2_temporal: {groups: [s2_band, s2_index, delta, seasonal], sensors: [S2]}
  E3_S1_only: {groups: [s1]}
  E4_S1_S2_fusion: {groups: [s2_band, s2_index, s1, delta, seasonal]}
  E5_fusion_P1_P2: {groups: [s2_band, s2_index, s1, delta], periods: [P1, P2]}
  E6_fusion_P1_P3: {groups: [s2_band, s2_index, s1, delta], periods: [P1, P2, P3]}
  E7_timeseries: {groups: [ts, phenology, harmonic]}
  E8_windows_plus_timeseries: {groups: [s2_band, s2_index, s1, delta, seasonal, ts, phenology, harmonic]}

parcels:
  declared_field: declared_crop
  crop_mapping: configs/crop_mapping.example.csv   # TODO: replace with the RS LPIS code list mapping
  strategy: combined
  interior_buffer_px: 1
  min_valid_pixels: 4

validation:
  year: 2023
  training_exclusion_m: 50
  window_px: 1

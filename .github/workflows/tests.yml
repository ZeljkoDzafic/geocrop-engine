name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,stac,web]'
      - run: ruff check src tests
      - run: ruff check integrations/qgis tools/build_qgis_plugin.py
      - run: python -m pytest
      - run: geocrop demo --root /tmp/geocrop-demo

name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,stac,web]'
      - run: ruff check src tests tools
      - run: ruff check integrations/qgis tools/build_qgis_plugin.py
      - run: python tools/check_presentation_site.py
      - run: python tools/check_versions.py
      # Fail-under is the measured total on this minimal install (statements + branches, 78.6 %) minus 2; raise it as tests grow.
      - run: >-
          python -m pytest --cov=geocrop --cov-branch --cov-report=xml --cov-report=term
          --cov-fail-under=76
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
      - run: geocrop demo --root /tmp/geocrop-demo

  pinned:
    # The audited, pinned dependency set (constraints/py312.txt) must install and pass the suite.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,all,stac,web]' -c constraints/py312.txt
      - run: python -m pytest -q

  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      # Pinned set shipped in the repository, then the latest resolvable set of every runtime extra.
      - run: pip-audit --progress-spinner off -r constraints/py312.txt
      - run: |
          python -m venv /tmp/latest
          /tmp/latest/bin/python -m pip install --upgrade pip
          /tmp/latest/bin/python -m pip install '.[all,stac,web]'
          pip-audit --progress-spinner off --path "$(/tmp/latest/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -t geocrop-engine:ci .
      - run: docker run --rm geocrop-engine:ci --version

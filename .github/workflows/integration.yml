name: integration
# Real Sentinel-2 data (public COGs) and larger-raster/memory tests; weekly and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
jobs:
  real-data-and-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,stac]'
      - run: python -m pytest -m "network or slow" -rs
